[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cable-ring-planner"
version = "0.1.0"
description = "Hub placement and verified closed-ring cable routing for floor plans"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
  "matplotlib>=3.8,<4",
  "networkx>=3,<4",
  "shapely>=2,<3",
  "streamlit>=1.40,<2",
  "fastapi>=0.115,<0.130",
  "reportlab>=4,<5",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["cable_planner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
